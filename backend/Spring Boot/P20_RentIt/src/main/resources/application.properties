spring.application.name=P20_RentIt


# Server Port
server.port=9090

spring.datasource.url= jdbc:mysql://localhost:3306/p20_rentit
spring.datasource.username=root
spring.datasource.password=root

# show query in console
spring.jpa.show-sql=true

# if table , column not available then they create new
spring.jpa.hibernate.ddl-auto=update  

eureka.client.registerWithEureka=true
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka

eureka.instance.hostname=localhost
eureka.instance.preferIpAddress=true

# Owner Service URL
owner.service.url=http://localhost:9092