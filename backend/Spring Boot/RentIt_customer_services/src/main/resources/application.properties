spring.application.name=RentIt_customer_services

# Server Port
server.port=9093

spring.datasource.url= jdbc:mysql://localhost:3306/p20_rentit
spring.datasource.username=root
spring.datasource.password=root

# show query in console
spring.jpa.show-sql=true

# if table , column not available then they create new
spring.jpa.hibernate.ddl-auto=update  

eureka.client.registerWithEureka=true
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka

eureka.instance.hostname=localhost
eureka.instance.preferIpAddress=true

# Disable service-level CORS by default (Gateway handles CORS)
app.cors.enabled=false